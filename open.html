<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulselyzer</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="app-icon" src="app_icon.png" alt="Pulselyzer">
      <h1>Pulselyzer</h1>
      <p>Pulselyzer aciliyor. Uygulama acilmazsa asagidaki butonlari kullanabilirsiniz.</p>
      <p class="actions">
        <a id="open-app" class="button" href="pulselyzer://open">Uygulamayi Ac</a>
        <a class="button secondary" href="https://play.google.com/store/apps/details?id=com.pulselyzer.mobile">Google Play</a>
      </p>
    </section>
  </main>
  <script>
    (function () {
      var query = window.location.search || '';
      var appUrl = 'pulselyzer://open' + query;
      var openButton = document.getElementById('open-app');
      openButton.href = appUrl;

      if (/Android/i.test(navigator.userAgent)) {
        window.setTimeout(function () {
          window.location.href = appUrl;
        }, 250);
      }
    }());
  </script>
</body>
</html>
