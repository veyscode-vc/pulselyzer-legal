<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulselyzer</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="robots" content="noindex">
  <style>
    .open-page {
      max-width: 520px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      margin: 0 auto;
      padding: 24px;
    }

    .open-page .hero {
      width: 100%;
    }

    .open-page .app-icon {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main class="open-page">
    <section class="hero">
      <img class="app-icon" src="app_icon.png" alt="Pulselyzer">
      <h1>Pulselyzer</h1>
      <p>Pulselyzer aciliyor. Uygulama cihazinizda yoksa Google Play sayfasina yonlendirilirsiniz.</p>
      <p class="actions">
        <a id="open-app" class="button" href="pulselyzer://open">Uygulamayi Ac</a>
        <a class="button secondary" href="https://play.google.com/store/apps/details?id=com.pulselyzer.mobile">Google Play</a>
      </p>
    </section>
  </main>
  <script>
    (function () {
      var query = window.location.search || '';
      var appUrl = 'pulselyzer://open' + query;
      var fallbackUrl = 'https://play.google.com/store/apps/details?id=com.pulselyzer.mobile';
      var intentUrl =
        'intent://open' + query +
        '#Intent;scheme=pulselyzer;package=com.pulselyzer.mobile;' +
        'S.browser_fallback_url=' + encodeURIComponent(fallbackUrl) +
        ';end';
      var openButton = document.getElementById('open-app');
      openButton.href = /Android/i.test(navigator.userAgent) ? intentUrl : appUrl;

      if (/Android/i.test(navigator.userAgent)) {
        window.setTimeout(function () {
          window.location.href = intentUrl;
        }, 250);
      }
    }());
  </script>
</body>
</html>
